name: Performance

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Presupuesto de performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Lighthouse mobile (3 corridas, mediana) contra el build de producción.
      # Límites en lighthouserc.json; detalle en docs/performance.md.
      - name: Lighthouse CI
        run: pnpm perf

      - name: Reportes de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14
